<script>
(function () {
    // ---------- Contact form ----------
    var form = document.getElementById("contact-form");
    var status = document.getElementById("contact-status");
    var button = document.getElementById("contact-submit");

    if (form) {
        form.addEventListener("submit", function (event) {
            event.preventDefault();
            status.className = "form-status";
            status.textContent = "Sending…";
            button.disabled = true;
            fetch("https://formspree.io/f/mkjgzebe", {
                method: "POST",
                body: new FormData(form),
                headers: { "Accept": "application/json" }
            }).then(function (response) {
                if (response.ok) {
                    form.reset();
                    status.className = "form-status success";
                    status.textContent = "Thank you. Your message has been sent.";
                } else {
                    return response.json().then(function (data) {
                        throw new Error((data && data.error) || "Please check the form and try again.");
                    });
                }
            }).catch(function () {
                status.className = "form-status error";
                status.textContent = "Sorry, the message could not be sent. Please try again shortly.";
            }).finally(function () {
                button.disabled = false;
            });
        });
    }

    // ---------- Upcoming Events Widget ----------
    var ICS_URL = "https://calendar.google.com/calendar/ical/walsallssuofpanel%40gmail.com/public/basic.ics";

    // Multiple free proxies (tried in order)
    var PROXIES = [
        "https://corsproxy.io/?" + encodeURIComponent(ICS_URL),
        "https://api.allorigins.win/raw?url=" + encodeURIComponent(ICS_URL),
        "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(ICS_URL)
    ];

    var loadingEl   = document.getElementById("events-loading");
    var slideshowEl = document.getElementById("events-slideshow");
    var emptyEl     = document.getElementById("events-empty");

    // Hard-coded fallback (includes the new 21 Oct event)
    var FALLBACK_EVENTS = [
        {
            title: "SSUOF Commission",
            description: "The bimonthly Walsall Stop and Search / Use of Force Scrutiny Panel Meeting provides independent community oversight to ensure local police powers are used fairly, lawfully, and proportionately. The panel reviews statistical data and body-worn video footage to evaluate officer conduct. Findings and recommendations are then submitted directly to West Midlands Police and the West Midlands Police and Crime Commissioner.",
            start: new Date("2026-10-21T17:00:00Z")
        },
        {
            title: "Panel Meeting",
            description: "The bimonthly Walsall Stop and Search / Use of Force Scrutiny Panel Meeting provides independent community oversight to ensure local police powers are used fairly, lawfully, and proportionately. The panel reviews statistical data and body-worn video footage to evaluate officer conduct. Findings and recommendations are then submitted directly to West Midlands Police and the West Midlands Police and Crime Commissioner.",
            start: new Date("2026-11-18T18:00:00Z")
        },
        {
            title: "Panel Meeting",
            description: "The bimonthly Walsall Stop and Search / Use of Force Scrutiny Panel Meeting provides independent community oversight to ensure local police powers are used fairly, lawfully, and proportionately. The panel reviews statistical data and body-worn video footage to evaluate officer conduct. Findings and recommendations are then submitted directly to West Midlands Police and the West Midlands Police and Crime Commissioner.",
            start: new Date("2027-02-10T18:00:00Z")
        },
        {
            title: "Panel Meeting",
            description: "The bimonthly Walsall Stop and Search / Use of Force Scrutiny Panel Meeting provides independent community oversight to ensure local police powers are used fairly, lawfully, and proportionately. The panel reviews statistical data and body-worn video footage to evaluate officer conduct. Findings and recommendations are then submitted directly to West Midlands Police and the West Midlands Police and Crime Commissioner.",
            start: new Date("2027-04-14T17:00:00Z")
        },
        {
            title: "Panel Meeting",
            description: "The bimonthly Walsall Stop and Search / Use of Force Scrutiny Panel Meeting provides independent community oversight to ensure local police powers are used fairly, lawfully, and proportionately. The panel reviews statistical data and body-worn video footage to evaluate officer conduct. Findings and recommendations are then submitted directly to West Midlands Police and the West Midlands Police and Crime Commissioner.",
            start: new Date("2027-10-13T17:00:00Z")
        }
    ];

    function parseICS(text) {
        // Unfold continued lines
        text = text.replace(/\r\n[ \t]/g, "").replace(/\n[ \t]/g, "");

        var events = [];
        var blocks = text.split("BEGIN:VEVENT");
        for (var i = 1; i < blocks.length; i++) {
            var block = blocks[i].split("END:VEVENT")[0];

            var summary = (block.match(/SUMMARY:(.+)/) || [])[1] || "Panel Meeting";

            var descMatch = block.match(/DESCRIPTION:([\s\S]*?)(?=\n[A-Z-]+:|$)/);
            var description = descMatch ? descMatch[1]
                .replace(/\\n/g, " ")
                .replace(/\\,/g, ",")
                .replace(/\\;/g, ";")
                .replace(/<[^>]+>/g, "")
                .replace(/\s+/g, " ")
                .trim() : "";

            var dtStart = (block.match(/DTSTART(?:;[^:]*)?:(\d{8}T\d{6}Z|\d{8})/) || [])[1];
            if (!dtStart) continue;

            var start;
            if (dtStart.length === 8) {
                start = new Date(dtStart.substring(0,4) + "-" + dtStart.substring(4,6) + "-" + dtStart.substring(6,8));
            } else {
                start = new Date(
                    dtStart.substring(0,4) + "-" +
                    dtStart.substring(4,6) + "-" +
                    dtStart.substring(6,8) + "T" +
                    dtStart.substring(9,11) + ":" +
                    dtStart.substring(11,13) + ":" +
                    dtStart.substring(13,15) + "Z"
                );
            }

            events.push({
                title: summary.trim(),
                description: description,
                start: start
            });
        }
        return events;
    }

    function formatDate(d) {
        return d.toLocaleDateString("en-GB", {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
        });
    }

    function formatTime(d) {
        return d.toLocaleTimeString("en-GB", {
            hour: "2-digit",
            minute: "2-digit",
            timeZone: "Europe/London"
        });
    }

    function renderEvents(events) {
        var now = new Date();
        var upcoming = events
            .filter(function (e) { return e.start >= now; })
            .sort(function (a, b) { return a.start - b.start; })
            .slice(0, 6);

        if (upcoming.length === 0) {
            loadingEl.style.display = "none";
            emptyEl.style.display = "block";
            return;
        }

        var html = "";
        upcoming.forEach(function (ev, idx) {
            html += '<div class="event-card' + (idx === 0 ? ' active' : '') + '" data-index="' + idx + '">';
            html +=   '<div class="event-date">' + formatDate(ev.start) + '</div>';
            html +=   '<div class="event-title">' + ev.title + '</div>';
            html +=   '<div class="event-time">' + formatTime(ev.start) + ' (UK time)</div>';
            if (ev.description) {
                html += '<div class="event-desc">' + ev.description + '</div>';
            }
            html += '</div>';
        });

        html += '<div class="events-dots">';
        upcoming.forEach(function (_, idx) {
            html += '<button type="button" class="events-dot' + (idx === 0 ? ' active' : '') +
                    '" data-index="' + idx + '" aria-label="Show meeting ' + (idx + 1) + '"></button>';
        });
        html += '</div>';

        slideshowEl.innerHTML = html;
        loadingEl.style.display = "none";
        slideshowEl.style.display = "block";

        var cards = slideshowEl.querySelectorAll(".event-card");
        var dots  = slideshowEl.querySelectorAll(".events-dot");
        var current = 0;
        var timer;

        function show(idx) {
            cards[current].classList.remove("active");
            dots[current].classList.remove("active");
            current = idx;
            cards[current].classList.add("active");
            dots[current].classList.add("active");
        }

        function next() {
            show((current + 1) % cards.length);
        }

        dots.forEach(function (dot) {
            dot.addEventListener("click", function () {
                clearInterval(timer);
                show(parseInt(dot.getAttribute("data-index"), 10));
                timer = setInterval(next, 6000);
            });
        });

        timer = setInterval(next, 6000);
    }

    // Try proxies one by one. If all fail, use the hard-coded fallback.
    function tryFetch(index) {
        if (index >= PROXIES.length) {
            console.warn("All proxies failed – using fallback events");
            renderEvents(FALLBACK_EVENTS);
            return;
        }

        fetch(PROXIES[index], { cache: "no-store" })
            .then(function (r) {
                if (!r.ok) throw new Error("Proxy status " + r.status);
                return r.text();
            })
            .then(function (ics) {
                if (ics.indexOf("BEGIN:VCALENDAR") === -1) throw new Error("Not valid ICS");
                var events = parseICS(ics);
                if (events.length === 0) throw new Error("No events found");
                renderEvents(events);
            })
            .catch(function (err) {
                console.warn("Proxy " + index + " failed:", err.message);
                tryFetch(index + 1);
            });
    }

    tryFetch(0);
})();
</script>
